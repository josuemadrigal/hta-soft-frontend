server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Fotos de pacientes tomadas con la cámara de la tablet; el backend las reduce.
  client_max_body_size 15M;

  # Con compose.production.yml Caddy manda /api y /uploads directo al backend y
  # estos bloques no se usan. Quedan para cuando la web esté detrás de otro proxy
  # que le pase todo a este contenedor (p. ej. un Caddy compartido en el VPS);
  # en ese caso hay dos proxies delante del backend: TRUST_PROXY_HOPS=2.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Los reportes (PDF, Excel) y la descarga de jornada pueden tardar.
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # El service worker y su registro nunca se guardan en caché HTTP: si el
  # navegador se quedara con uno viejo, las tablets no verían nunca la versión
  # nueva de la app (la PWA se actualiza sola solo si puede leer el sw.js nuevo).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # Vite pone un hash en el nombre de cada archivo de /assets: pueden quedarse
  # en caché un año porque cada versión nueva trae nombres nuevos.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cualquier otra ruta es de la SPA (React Router): se responde con index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
